# Configuracion del analisis de SonarQube para BibliotecaOnline (Issue #153).
# Guia: docs/cicd/sonarqube-instalacion.md
# El token NO va aqui: se pasa con la variable de entorno SONAR_TOKEN.

sonar.projectKey=BibliotecaOnline
sonar.projectName=BibliotecaOnline
sonar.sourceEncoding=UTF-8

# Codigo de la aplicacion (PHP, Blade, JS y CSS)
sonar.sources=app,bootstrap/app.php,config,database,routes,resources
sonar.exclusions=resources/js/tests/**

# Pruebas: PHPUnit, Vitest y Playwright
sonar.tests=tests,resources/js/tests

# Dependencias, compilados y reportes generados
sonar.global.exclusions=vendor/**,node_modules/**,public/build/**,storage/**,bootstrap/cache/**,docs/coverage/**,playwright-report/**,test-results/**

# Cobertura (opcional). Si existen estos reportes, SonarQube los usa:
#   PHP: php artisan test --coverage-clover coverage/clover.xml   (requiere Xdebug o PCOV)
#   JS:  npx vitest run --coverage --coverage.reporter=lcov       (genera coverage/lcov.info)
sonar.php.coverage.reportPaths=coverage/clover.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info
