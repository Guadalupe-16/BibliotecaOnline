; PHP de la imagen de liberacion (Issue #156)
expose_php = Off
memory_limit = 256M
upload_max_filesize = 8M
post_max_size = 8M

; OPcache: el codigo no cambia dentro de un contenedor liberado
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
