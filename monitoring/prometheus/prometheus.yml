# Prometheus de BibliotecaOnline (Issue #165, spec 004). Guia: docs/monitoreo/monitoreo.md
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Metricas de la aplicacion (GET /metrics, protegido con token Bearer)
  - job_name: bibliotecaonline
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["app:80"]

  # Disponibilidad: blackbox_exporter consulta el health check /up de Laravel
  - job_name: disponibilidad
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://app/up"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
